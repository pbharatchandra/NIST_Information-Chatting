<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Chat - NIST</title>
    <link rel="stylesheet" href="chat.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Messages</h2>
                <button id="newChatBtn" class="new-chat-btn" title="Start new chat">
                    <span>+</span>
                </button>
            </div>

            <!-- Online Users -->
            <div class="online-users">
                <h3>Online</h3>
                <div id="onlineUsersList" class="users-list"></div>
            </div>

            <!-- Conversations List -->
            <div class="conversations">
                <h3>Chats</h3>
                <div id="conversationsList" class="conversations-list"></div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <div id="noChatSelected" class="no-chat-selected">
                <div class="empty-state">
                    <h3>Select a chat to start messaging</h3>
                    <p>Choose someone from the online list or your recent conversations</p>
                </div>
            </div>

            <div id="chatWindow" class="chat-window" style="display: none;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h3 id="chatUserName"></h3>
                        <span id="userStatus" class="user-status"></span>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="messagesArea" class="messages-area"></div>

                <!-- Typing Indicator -->
                <div id="typingIndicator" class="typing-indicator" style="display: none;">
                    <span id="typingUserName"></span> is typing...
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <input 
                        type="text" 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="Type a message..."
                        autocomplete="off"
                    >
                    <button id="sendBtn" class="send-btn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for selecting user -->
    <div id="userModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Start a Conversation</h2>
            <input 
                type="text" 
                id="userSearchInput" 
                class="user-search" 
                placeholder="Search users..."
            >
            <div id="userListModal" class="user-list-modal"></div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
