<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NIST Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="auth-page">
            <div class="auth-form">
                <h2>Welcome Back</h2>
                <p class="subtitle">Login to NIST Chat</p>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>

                <div class="auth-link">
                    Don't have an account? <a href="signup.html">Sign up here</a>
                </div>

                <div style="margin-top: 20px; text-align: center; padding-top: 20px; border-top: 1px solid #eee;">
                    <a href="admin_login.html" class="admin-panel-link" style="font-size: 13px;">🔐 Admin Login</a>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Login failed');
                    return;
                }

                // Store token and user info for all users
                localStorage.setItem('token', data.token);
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Check user type and redirect accordingly
                if (data.user.user_type === 'admin') {
                    // Admin should not be using regular login - redirect to admin login
                    showError('Please use the Admin Login page');
                    setTimeout(() => {
                        window.location.href = 'admin_login.html';
                    }, 1500);
                } else if (data.user.user_type === 'student') {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = './student_dashboard/dashboard.html';
                    }, 1500);
                } else if (data.user.user_type === 'faculty') {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = './faculty_dashboard/dashboard.html';
                    }, 1500);
                } else if (data.user.user_type === 'alumni') {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = './alumni_dashboard/dashboard.html';
                    }, 1500);
                } else {
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = './student_dashboard/dashboard.html';
                    }, 1500);
                }
            } catch (error) {
                showError('Network error. Please try again.');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

    </script>
</body>
</html>
